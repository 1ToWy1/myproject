[project]
name = "myproject"
version = "0.1.0"
description = ""
authors = [
    {name = "1ToWy1",email = "ramill220033@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)"
]

[tool.poetry]
packages = [{include = "myproject", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)"
]
[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [".venv", "__pycache__", ".git"]

unsafe-fixes = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C90", "PL", "N", "SIM", "ARG"
]

ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"